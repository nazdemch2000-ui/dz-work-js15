<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <form id="registerForm" novalidate>
      <h2>Реєстрація</h2>

      <p id="formStatus" class="form-status">Заповнено 0 з 4 полів</p>

      <div class="form-group">
        <label for="name">Ім'я</label>
        <input type="text" id="name" name="name" />
        <span class="error-message" id="error-name"></span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
        <span class="error-message" id="error-email"></span>
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" />
        <span class="error-message" id="error-password"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Підтвердження пароля</label>
        <input type="password" id="confirmPassword" name="confirmPassword" />
        <span class="error-message" id="error-confirmPassword"></span>
      </div>

      <button type="submit">Зареєструватися</button>

      <p id="formMessage" class="form-message" role="alert"></p>
    </form>

    <script src="script.js"></script>
  </body>
</html>
